services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-reportes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ventas_async_db}
      MYSQL_USER: ${DB_USER:-reportes}
      MYSQL_PASSWORD: ${DB_PASSWORD:-reportes_dev_only}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
